# Zephyr RTOS Threading Project Configuration

# Enable console and UART for printk output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# Enable printk for debugging
CONFIG_PRINTK=y

#Thread and Kernel configuration
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=15

# Work Queue Support
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

#Random Number Generator (for producer data)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Thread name support (for debugging)
CONFIG_THREAD_NAME=y

# Stack Sentinel (for stack overflow detection)
CONFIG_THREAD_STACK_INFO=y

# Memory Settings
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=2048

# Assert and error handling
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
